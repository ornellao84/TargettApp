name: Build TargettApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html script.js style.css workout365.json www/

      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare signing key
        env:
          TARGETTAPP_KEYSTORE_BASE64: ${{ secrets.TARGETTAPP_KEYSTORE_BASE64 }}
        run: |
          echo "$TARGETTAPP_KEYSTORE_BASE64" | base64 --decode > targettapp-release.keystore

      - name: Build signed APK
        env:
          TARGETTAPP_KEYSTORE_PASSWORD: ${{ secrets.TARGETTAPP_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TargettApp-APK
          path: android/app/build/outputs/apk/release/app-release.apk
